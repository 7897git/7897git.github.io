<!DOCTYPE html>
<html lang="id">
  <head>
    {% include ion-head.html %}
  </head>
  <body>
    <!-- +++ BARIS BARU: Overlay login, muncul kalau belum login +++ -->
    <div id="loginOverlay" style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <ion-card style="max-width: 320px; text-align: center;">
        <ion-card-header>
          <ion-card-title>🎬 StreamMov</ion-card-title>
          <ion-card-subtitle>Login dengan Google</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <ion-button expand="block" onclick="doGoogleLogin()">
            <ion-icon slot="start" name="logo-google"></ion-icon>
            Masuk dengan Google
          </ion-button>
        </ion-card-content>
      </ion-card>
    </div>

    <ion-app>
      {% include tab-content.html %}
    </ion-app>

    {% include analytics.html %}

    <!-- +++ BARIS BARU: File auth yang sudah kamu isi +++ -->
    {% include firebase-auth.html %}
    
    {% include jsScript.html %}
  </body>
</html>
