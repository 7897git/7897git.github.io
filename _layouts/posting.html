<!DOCTYPE html>
<html lang="id">
  <head>
    {% include ion-head.html %}
    <script type="module">
      import { popoverController } from 'https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/index.esm.js';
      window.popoverController = popoverController;
    </script>
  </head>
  <body>
    <ion-app>
      <ion-header translucent>
        <ion-toolbar fullscreen>
          <div style="padding-top:56.25%;position:relative;">
<iframe id="fullscreen" src="{{page.movie}}" style="border:0;max-width:100%;position:absolute;top:0;left:0;height:100%;width:100%;" allowFullScreen="true" allow="encrypted-media" allow="accelerometer; autoplay; clipboard-write; gyroscope; picture-in-picture"></iframe>
</div>
<ion-item>
  <ion-label><h2 color="dark">{{page.title}}</h2><p>{{page.actor}}</p></ion-label>
<ion-buttons>
<ion-button onclick="openFullscreen();">
  <ion-icon slot="icon-only" name="open-outline"></ion-icon>
</ion-buttons>
</ion-button>
</ion-item>
<ion-item fullscreen>
<ion-buttons>
<ion-button onclick="backHome()">
<ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
<ion-button>
<ion-icon slot="icon-only" name="thumbs-up-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
<ion-button>
<ion-icon slot="icon-only" name="thumbs-down-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
<ion-button id="trigger-chat">
<ion-icon slot="icon-only" name="chatbox-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
<ion-button href="{{page.dl}}">
<ion-icon slot="icon-only" name="cloud-download-outline"></ion-icon>
</ion-button>
</ion-buttons>
</ion-item>
        </ion-toolbar>
       </ion-header>
      <ion-content fullscreen>
      {{ content }}
      </ion-content>
<ion-modal trigger="trigger-chat" id="commentModal">
  <ion-header translucent>
    <ion-toolbar>
      <ion-title>💬 Komentar</ion-title>
      <ion-buttons slot="end">
        <ion-button onclick="dismissModal()">
          <ion-icon color="danger" slot="icon-only" name="close"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  
  <ion-content class="ion-padding" style="--padding-bottom: 80px;">
    <!-- Tempat daftar komentar -->
    <div id="comments-container">
      <!-- komentar akan dimuat di sini -->
    </div>
  </ion-content>

  <!-- Area form komentar (fixed di bawah) -->
  <div style="position: sticky; bottom: 0; background: var(--ion-background-color, #fff); border-top: 1px solid #ccc; padding: 12px; z-index: 10;">
    <div id="comment-form" style="display: none;">
      <ion-item>
        <ion-textarea id="commentText" placeholder="Tulis komentar Anda..." rows="2"></ion-textarea>
      </ion-item>
      <ion-button expand="block" id="submitCommentBtn">Kirim Komentar</ion-button>
    </div>
    <div id="login-prompt" style="text-align: center; display: none;">
      <p>🔐 <a href="/">Login dengan Google</a> untuk berkomentar.</p>
    </div>
  </div>
</ion-modal>
    </ion-app>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7VKD8Y6NKcXLHAk89jpG9evCA6eXk5Hk",
    authDomain: "dafftube-xxx.firebaseapp.com",
    projectId: "dafftube-xxx",
    storageBucket: "dafftube-xxx.firebasestorage.app",
    databaseURL: "https://dafftube-xxx-default-rtdb.asia-southeast2.firebasedatabase.app",
    messagingSenderId: "522399111487",
    appId: "1:522399111487:web:70be78d9a11ab658295b8a",
    measurementId: "G-48TZZE3TMS"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const slug = window.location.pathname.split('/').pop();
  const filmTitle = slug.replace(/-/g, ' ');

  let currentUser = null;
  let modal = document.getElementById('commentModal');

  // Fungsi render komentar
  async function loadComments() {
    const container = document.getElementById("comments-container");
    if (!container) return;
    
    const commentsRef = collection(db, "comments");
    const q = query(commentsRef, where("filmSlug", "==", slug), orderBy("timestamp", "asc"));
    const snapshot = await getDocs(q);
    
    container.innerHTML = "";
    if (snapshot.empty) {
      container.innerHTML = "<p style='text-align:center;'>Belum ada komentar. Jadilah yang pertama!</p>";
      return;
    }
    
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const commentDiv = document.createElement("div");
      commentDiv.style.borderBottom = "1px solid #ccc";
      commentDiv.style.marginBottom = "12px";
      commentDiv.style.paddingBottom = "8px";
      commentDiv.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
          <img src="${data.photoURL || 'https://ionicframework.com/docs/img/demos/avatar.svg'}" style="width:32px; height:32px; border-radius:50%;">
          <strong>${escapeHtml(data.displayName)}</strong>
          <small>${new Date(data.timestamp?.toDate()).toLocaleString()}</small>
          ${currentUser && currentUser.uid === data.userId ? `<ion-button fill="clear" size="small" data-id="${docSnap.id}" class="delete-comment" style="margin-left:auto;">🗑️</ion-button>` : ''}
        </div>
        <p style="margin-top:8px;">${escapeHtml(data.text)}</p>
      `;
      container.appendChild(commentDiv);
    });

    // Event hapus komentar
    document.querySelectorAll('.delete-comment').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = btn.getAttribute('data-id');
        if (confirm("Hapus komentar ini?")) {
          await deleteDoc(doc(db, "comments", id));
          loadComments();
        }
      });
    });
  }

  // Kirim komentar
  async function submitComment(text) {
    if (!text.trim()) return alert("Komentar tidak boleh kosong.");
    if (!currentUser) return alert("Login dulu untuk berkomentar.");
    try {
      await addDoc(collection(db, "comments"), {
        filmSlug: slug,
        filmTitle: filmTitle,
        userId: currentUser.uid,
        displayName: currentUser.displayName,
        photoURL: currentUser.photoURL,
        text: text.trim(),
        timestamp: new Date()
      });
      document.getElementById("commentText").value = "";
      loadComments();
    } catch (err) {
      console.error(err);
      alert("Gagal kirim komentar: " + err.message);
    }
  }

  // UI form komentar berdasarkan login
  function updateCommentUI(user) {
    const formDiv = document.getElementById("comment-form");
    const loginPrompt = document.getElementById("login-prompt");
    if (user) {
      formDiv.style.display = "block";
      loginPrompt.style.display = "none";
    } else {
      formDiv.style.display = "none";
      loginPrompt.style.display = "block";
    }
  }

  // Helper escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Tombol submit
  document.getElementById("submitCommentBtn")?.addEventListener("click", () => {
    const text = document.getElementById("commentText").value;
    submitComment(text);
  });

  // Fungsi dismiss modal (global)
  window.dismissModal = () => {
    if (modal) modal.dismiss();
  };

  // Ketika modal dibuka, load komentar
  if (modal) {
    modal.addEventListener('ionModalDidPresent', () => {
      loadComments();
    });
  }

  // Auth state
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    updateCommentUI(user);
    loadComments(); // refresh saat login/logout
  });
</script>

    {% include analytics.html %}
    {% include jsScript.html %}
    {% include firebase-auth.html %}
  </body>
</html>
