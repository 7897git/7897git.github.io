<!DOCTYPE html>
<html lang="id">
  <head>
    {% include ion-head.html %}
    <script type="module">
      import { popoverController } from 'https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/index.esm.js';
      window.popoverController = popoverController;
    </script>
  </head>
  <body>
    <ion-app>
      <ion-header translucent>
        <ion-toolbar fullscreen>
          <div style="padding-top:56.25%;position:relative;">
<iframe id="fullscreen" src="{{page.movie}}" style="border:0;max-width:100%;position:absolute;top:0;left:0;height:100%;width:100%;" allowFullScreen="true" allow="encrypted-media" allow="accelerometer; autoplay; clipboard-write; gyroscope; picture-in-picture"></iframe>
</div>
<ion-item>
  <ion-label><h2 color="dark">{{page.title}}</h2><p>{{page.actor}}</p></ion-label>
<ion-buttons>
<ion-button onclick="openFullscreen();">
  <ion-icon slot="icon-only" name="open-outline"></ion-icon>
</ion-buttons>
</ion-button>
</ion-item>
<ion-item fullscreen>
<ion-buttons>
<ion-button onclick="backHome()">
<ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
  <ion-button id="likeBtn">
    <ion-icon slot="icon-only" name="thumbs-up-outline" id="likeIcon"></ion-icon>
  </ion-button>
</ion-buttons>
    <span id="likeCount" style="margin-left: 4px; font-size: 14px;">0</span>
<div class="separator"></div>
<ion-buttons>
  <ion-button id="dislikeBtn">
    <ion-icon slot="icon-only" name="thumbs-down-outline" id="dislikeIcon"></ion-icon>
  </ion-button>
</ion-buttons>
<span id="dislikeCount" style="margin-left: 4px; font-size: 14px;">0</span>
<div class="separator"></div>
<ion-buttons>
<ion-button id="trigger-chat">
<ion-icon slot="icon-only" name="chatbox-outline"></ion-icon>
</ion-button>
</ion-buttons>
<div class="separator"></div>
<ion-buttons>
<ion-button href="{{page.dl}}">
<ion-icon slot="icon-only" name="cloud-download-outline"></ion-icon>
</ion-button>
</ion-buttons>
</ion-item>
        </ion-toolbar>
       </ion-header>
      <ion-content fullscreen>
      {{ content }}
      </ion-content>
<ion-modal trigger="trigger-chat" id="commentModal">
  <ion-header translucent>
    <ion-toolbar>
      <ion-title>💬 Komentar</ion-title>
      <ion-buttons slot="end">
        <ion-button onclick="dismissModal()">
          <ion-icon color="danger" slot="icon-only" name="close"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  
  <ion-content class="ion-padding" style="--padding-bottom: 100px;">
    <!-- Tempat komentar -->
    <div id="comments-container" style="min-height: 200px;">
      <p style="text-align:center;">Memuat komentar...</p>
    </div>
  </ion-content>

  <!-- Form fixed di bawah -->
  <div style="position: sticky; bottom: 0; background: var(--ion-background-color, #fff); border-top: 1px solid #ccc; padding: 12px; z-index: 10;">
    <div id="comment-form" style="display: none;">
      <ion-item>
        <ion-textarea id="commentText" placeholder="Tulis komentar Anda..." rows="2"></ion-textarea>
      </ion-item>
      <ion-button expand="block" id="submitCommentBtn">Kirim Komentar</ion-button>
    </div>
    <div id="login-prompt" style="text-align: center; display: none;">
      <p>🔐 <a href="/">Login dengan Google</a> untuk berkomentar.</p>
    </div>
  </div>
</ion-modal>
      
      <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
  getFirestore, collection, addDoc, query, where, orderBy, getDocs, deleteDoc, 
  doc, getDoc, runTransaction 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7VKD8Y6NKcXLHAk89jpG9evCA6eXk5Hk",
    authDomain: "dafftube-xxx.firebaseapp.com",
    projectId: "dafftube-xxx",
    storageBucket: "dafftube-xxx.firebasestorage.app",
    databaseURL: "https://dafftube-xxx-default-rtdb.asia-southeast2.firebasedatabase.app",
    messagingSenderId: "522399111487",
    appId: "1:522399111487:web:70be78d9a11ab658295b8a",
    measurementId: "G-48TZZE3TMS"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const slug = window.location.pathname.split('/').pop();
  const filmTitle = slug.replace(/-/g, ' ');

  let currentUser = null;
  const modal = document.getElementById('commentModal');

  async function loadComments() {
    const container = document.getElementById('comments-container');
    if (!container) {
      console.error("ERROR: Element #comments-container tidak ditemukan!");
      return;
    }
    
    console.log("Loading comments for slug:", slug);
    container.innerHTML = "<p style='text-align:center;'>⏳ Memuat komentar...</p>";
    
    try {
      const commentsRef = collection(db, "comments");
      const q = query(commentsRef, where("filmSlug", "==", slug), orderBy("timestamp", "asc"));
      const snapshot = await getDocs(q);
      
      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align:center;'>💬 Belum ada komentar. Jadilah yang pertama!</p>";
        return;
      }
      
      container.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const commentDiv = document.createElement("div");
        commentDiv.style.borderBottom = "1px solid #ccc";
        commentDiv.style.marginBottom = "12px";
        commentDiv.style.paddingBottom = "8px";
        commentDiv.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <img src="${data.photoURL || 'https://ionicframework.com/docs/img/demos/avatar.svg'}" style="width:32px; height:32px; border-radius:50%;">
<div style="display: flex; justify-content: space-between;>
            <strong>${escapeHtml(data.displayName)}</strong>
            <small>${new Date(data.timestamp?.toDate()).toLocaleString()}</small>
</div>
            ${currentUser && currentUser.uid === data.userId ? `<ion-button fill="clear" size="small" data-id="${docSnap.id}" class="delete-comment" style="margin-left:auto;">🗑️</ion-button>` : ''}
          </div>
          <p style="margin-top:8px;">${escapeHtml(data.text)}</p>
        `;
        container.appendChild(commentDiv);
      });
      
      // Event hapus komentar
      document.querySelectorAll('.delete-comment').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = btn.getAttribute('data-id');
          if (confirm("Hapus komentar ini?")) {
            await deleteDoc(doc(db, "comments", id));
            loadComments();
          }
        });
      });
    } catch (err) {
      console.error("Error loading comments:", err);
      container.innerHTML = "<p style='text-align:center;color:red;'>Gagal memuat komentar. Periksa koneksi atau izin database.</p>";
    }
  }

  async function submitComment(text) {
    if (!text.trim()) {
      alert("Komentar tidak boleh kosong.");
      return;
    }
    if (!currentUser) {
      alert("Login dulu untuk berkomentar.");
      return;
    }
    try {
      await addDoc(collection(db, "comments"), {
        filmSlug: slug,
        filmTitle: filmTitle,
        userId: currentUser.uid,
        displayName: currentUser.displayName,
        photoURL: currentUser.photoURL,
        text: text.trim(),
        timestamp: new Date()
      });
      document.getElementById("commentText").value = "";
      loadComments();
    } catch (err) {
      console.error("Error submitting comment:", err);
      alert("Gagal kirim komentar: " + err.message);
    }
  }

// ==================== LIKE / DISLIKE ====================
const likeBtn = document.getElementById('likeBtn');
const dislikeBtn = document.getElementById('dislikeBtn');
const likeIcon = document.getElementById('likeIcon');
const dislikeIcon = document.getElementById('dislikeIcon');
const likeCountSpan = document.getElementById('likeCount');
const dislikeCountSpan = document.getElementById('dislikeCount');

// Load data like/dislike dari Firestore
async function loadLikeDislike() {
  if (!currentUser) return;
  const docRef = doc(db, 'filmStats', slug);
  const docSnap = await getDoc(docRef);
  if (docSnap.exists()) {
    const data = docSnap.data();
    likeCountSpan.innerText = data.likes || 0;
    dislikeCountSpan.innerText = data.dislikes || 0;
    const userId = currentUser.uid;
    if (data.likedBy && data.likedBy.includes(userId)) {
      likeIcon.name = 'thumbs-up';
    } else {
      likeIcon.name = 'thumbs-up-outline';
    }
    if (data.dislikedBy && data.dislikedBy.includes(userId)) {
      dislikeIcon.name = 'thumbs-down';
    } else {
      dislikeIcon.name = 'thumbs-down-outline';
    }
  } else {
    likeCountSpan.innerText = '0';
    dislikeCountSpan.innerText = '0';
    likeIcon.name = 'thumbs-up-outline';
    dislikeIcon.name = 'thumbs-down-outline';
  }
}

// Like
async function handleLike() {
  if (!currentUser) {
    alert('Login dulu untuk memberikan like.');
    return;
  }
  const userId = currentUser.uid;
  const docRef = doc(db, 'filmStats', slug);
  await runTransaction(db, async (transaction) => {
    const docSnap = await transaction.get(docRef);
    if (!docSnap.exists()) {
      transaction.set(docRef, {
        likes: 1,
        dislikes: 0,
        likedBy: [userId],
        dislikedBy: []
      });
    } else {
      const data = docSnap.data();
      let likes = data.likes || 0;
      let dislikes = data.dislikes || 0;
      let likedBy = data.likedBy || [];
      let dislikedBy = data.dislikedBy || [];
      if (likedBy.includes(userId)) {
        // Batalkan like
        likes -= 1;
        likedBy = likedBy.filter(id => id !== userId);
      } else {
        // Jika sudah dislike, hapus dislike dulu
        if (dislikedBy.includes(userId)) {
          dislikes -= 1;
          dislikedBy = dislikedBy.filter(id => id !== userId);
        }
        likes += 1;
        likedBy.push(userId);
      }
      transaction.update(docRef, { likes, dislikes, likedBy, dislikedBy });
    }
  });
  await loadLikeDislike();
}

// Dislike
async function handleDislike() {
  if (!currentUser) {
    alert('Login dulu untuk memberikan dislike.');
    return;
  }
  const userId = currentUser.uid;
  const docRef = doc(db, 'filmStats', slug);
  await runTransaction(db, async (transaction) => {
    const docSnap = await transaction.get(docRef);
    if (!docSnap.exists()) {
      transaction.set(docRef, {
        likes: 0,
        dislikes: 1,
        likedBy: [],
        dislikedBy: [userId]
      });
    } else {
      const data = docSnap.data();
      let likes = data.likes || 0;
      let dislikes = data.dislikes || 0;
      let likedBy = data.likedBy || [];
      let dislikedBy = data.dislikedBy || [];
      if (dislikedBy.includes(userId)) {
        dislikes -= 1;
        dislikedBy = dislikedBy.filter(id => id !== userId);
      } else {
        if (likedBy.includes(userId)) {
          likes -= 1;
          likedBy = likedBy.filter(id => id !== userId);
        }
        dislikes += 1;
        dislikedBy.push(userId);
      }
      transaction.update(docRef, { likes, dislikes, likedBy, dislikedBy });
    }
  });
  await loadLikeDislike();
}

// Event listener
if (likeBtn) likeBtn.addEventListener('click', handleLike);
if (dislikeBtn) dislikeBtn.addEventListener('click', handleDislike);

  function updateCommentUI(user) {
    const formDiv = document.getElementById("comment-form");
    const loginPrompt = document.getElementById("login-prompt");
    if (user) {
      if (formDiv) formDiv.style.display = "block";
      if (loginPrompt) loginPrompt.style.display = "none";
    } else {
      if (formDiv) formDiv.style.display = "none";
      if (loginPrompt) loginPrompt.style.display = "block";
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  window.dismissModal = () => {
    if (modal) modal.dismiss();
  };

  // Tombol submit
  const submitBtn = document.getElementById("submitCommentBtn");
  if (submitBtn) {
    submitBtn.addEventListener("click", () => {
      const textInput = document.getElementById("commentText");
      if (textInput) submitComment(textInput.value);
    });
  }

  // Saat modal dibuka, load komentar
  if (modal) {
    modal.addEventListener('ionModalDidPresent', () => {
      console.log("Modal opened, loading comments...");
      loadComments();
    });
  } else {
    console.error("Modal dengan ID #commentModal tidak ditemukan di DOM.");
  }

  // Auth state change
  onAuthStateChanged(auth, (user) => {
  currentUser = user;
  updateCommentUI(user);
  loadComments();
  loadLikeDislike();
});

if (currentUser) loadLikeDislike();
</script>

    </ion-app>
  
    {% include analytics.html %}
    {% include jsScript.html %}
    {% include firebase-auth.html %}
  </body>
</html>
