<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StreamMov</title>
  <!-- Ionic (opsional, bisa pakai CSS biasa) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css">
  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyB7VKD8Y6NKcXLHAk89jpG9evCA6eXk5Hk",
  authDomain: "dafftube-xxx.firebaseapp.com",
  projectId: "dafftube-xxx",
  storageBucket: "dafftube-xxx.firebasestorage.app",
  messagingSenderId: "522399111487",
  appId: "1:522399111487:web:70be78d9a11ab658295b8a",
  measurementId: "G-48TZZE3TMS"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Jika sudah login, langsung arahkan ke /home
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '/home';
      }
    });

    window.doGoogleLogin = async () => {
      try {
        await signInWithPopup(auth, provider);
        // Redirect otomatis oleh onAuthStateChanged
      } catch (err) {
        alert('Login gagal: ' + err.message);
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .login-card {
      max-width: 360px;
      width: 90%;
      text-align: center;
      padding: 2rem;
      border-radius: 2rem;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 {
      color: white;
      margin-bottom: 1rem;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: white;
      color: #1f2937;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 1rem;
    }
    .google-btn:hover {
      background: #f3f4f6;
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🎬 StreamMov</h1>
    <p style="color: #cbd5e1;">Login untuk akses semua film</p>
    <button class="google-btn" onclick="doGoogleLogin()">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Login dengan Google

</body>
