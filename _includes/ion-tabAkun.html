<ion-tab tab="akun">
  <ion-header translucent>
    <ion-toolbar>
      <ion-title>👤 Akun Saya</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <!-- Area Avatar -->
    <ion-avatar style="width: 80px; height: 80px; margin: 20px auto;">
      <img id="userAvatar" src="">
    </ion-avatar>

    <!-- Informasi Pengguna -->
    <ion-item>
      <ion-label>Nama</ion-label>
      <ion-text id="userName"></ion-text>
    </ion-item>
    <ion-item>
      <ion-label>Email</ion-label>
      <ion-text id="userEmail"></ion-text>
    </ion-item>

    <!-- Tombol Logout -->
    <ion-button expand="block" onclick="doLogout()" color="danger">Logout</ion-button>
  </ion-content>
</ion-tab>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3ra4E7chQhRzERyKW2aFUTRULMb10vxM",
    authDomain: "blogdaffadev.firebaseapp.com",
    databaseURL: "https://blogdaffadev-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "blogdaffadev",
    storageBucket: "blogdaffadev.firebasestorage.app",
    messagingSenderId: "489703180131",
    appId: "1:489703180131:web:4383f5ef04c1d414ce3556",
    measurementId: "G-ZWW4K4NVQ6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Fungsi untuk mengisi data user ke tab Akun
  function updateUserProfile(user) {
    if (!user) return;

    const avatarImg = document.getElementById('userAvatar');
    const userNameSpan = document.getElementById('userName');
    const userEmailSpan = document.getElementById('userEmail');

    if (avatarImg) avatarImg.src = user.photoURL || 'https://ionicframework.com/docs/img/demos/avatar.svg';
    if (userNameSpan) userNameSpan.innerText = user.displayName || user.email.split('@')[0];
    if (userEmailSpan) userEmailSpan.innerText = user.email;
  }

  // Fungsi logout global
  window.doLogout = async () => {
    try {
      await signOut(auth);
      // Redirect ke halaman login
      window.location.href = '/';
    } catch (error) {
      console.error('Logout gagal:', error);
      alert('Gagal logout: ' + error.message);
    }
  };

  // Pantau perubahan status login
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // Isi data profil
      updateUserProfile(user);
    } else {
      // Jika belum login, redirect ke halaman login
      window.location.href = '/';
    }
  });
</script>
