
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

 const firebaseConfig = {
  apiKey: "AIzaSyB7VKD8Y6NKcXLHAk89jpG9evCA6eXk5Hk",
  authDomain: "dafftube-xxx.firebaseapp.com",
  projectId: "dafftube-xxx",
  storageBucket: "dafftube-xxx.firebasestorage.app",
  messagingSenderId: "522399111487",
  appId: "1:522399111487:web:70be78d9a11ab658295b8a",
  measurementId: "G-48TZZE3TMS"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Fungsi untuk mengisi data user ke tab Akun
  function updateUserProfile(user) {
    if (!user) return;

    const avatarImg = document.getElementById('userAvatar');
    const userNameSpan = document.getElementById('userName');
    const userEmailSpan = document.getElementById('userEmail');

    if (avatarImg) avatarImg.src = user.photoURL || 'https://ionicframework.com/docs/img/demos/avatar.svg';
    if (userNameSpan) userNameSpan.innerText = user.displayName || user.email.split('@')[0];
    if (userEmailSpan) userEmailSpan.innerText = user.email;
  }

  // Fungsi logout global
  window.doLogout = async () => {
    try {
      await signOut(auth);
      // Redirect ke halaman login
      window.location.href = '/';
    } catch (error) {
      console.error('Logout gagal:', error);
      alert('Gagal logout: ' + error.message);
    }
  };

  // Pantau perubahan status login
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // Isi data profil
      updateUserProfile(user);
    } else {
      // Jika belum login, redirect ke halaman login
      window.location.href = '/';
    }
  });
</script>
